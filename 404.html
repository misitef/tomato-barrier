<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 · 番茄结界</title>
<!-- 404 页可能在任何路径深度被展示，样式全部内联，避免相对路径失效 -->
<style>
  :root { --green:#1E6B52; --bg:#F7FAF7; --text:#191C1A; --muted:#5A635E; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Source Han Sans SC", sans-serif;
    line-height: 1.75; text-align: center;
  }
  h1 { font-size: 28px; margin: 0 0 10px; }
  p { color: var(--muted); margin: 0 0 26px; font-size: 15px; }
  a {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 46px; padding: 0 26px; border-radius: 999px;
    background: var(--green); color: #fff; text-decoration: none;
    font-size: 15px; font-weight: 600;
  }
</style>
</head>
<body>
  <main>
    <h1>页面不存在</h1>
    <p>这条链接可能已经失效，或者地址打错了。</p>
    <a id="home" href="/">回到首页</a>
    <script>
      // 项目页部署在子路径下，用当前路径推断站点根，避免写死域名
      (function () {
        var parts = location.pathname.split('/').filter(Boolean);
        var root = parts.length ? '/' + parts[0] + '/' : '/';
        document.getElementById('home').setAttribute('href', root);
      })();
    </script>
  </main>
</body>
</html>
