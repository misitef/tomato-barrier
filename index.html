<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄结界 · 全屏专注，白名单管控</title>
<meta name="description" content="番茄结界是一款纯本地安卓专注工具：全屏番茄钟 + 应用白名单管控，零网络权限，所有数据仅保存在本机。">
<meta name="theme-color" content="#1E6B52">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="./">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">番茄结界</span>
    </a>
    <!-- 多语言位预留：后续加 <div class="lang-switch">…</div> -->
  </div>
</header>

<main>

  <section class="hero">
    <div class="wrap hero-inner">
      <div class="hero-copy">
        <h1>番茄结界</h1>
        <p class="hero-sub">全屏专注 · 应用白名单管控</p>
        <p class="hero-lead">
          设定一段专注时间，只放行你允许的应用。<br>
          其余的，到点了自然会被请回专注。
        </p>
        <div class="hero-actions">
          <span class="btn btn-primary is-disabled" aria-disabled="true">即将上线</span>
          <a class="btn btn-ghost" href="privacy/">隐私政策</a>
        </div>
        <p class="hero-note">纯本地运行 · 无网络权限 · 无账号体系</p>
      </div>
      <div class="hero-visual">
        <img src="assets/img/app-home.png" width="1080" height="1920"
             alt="番茄结界主界面：选择专注时长并开始专注" loading="eager">
      </div>
    </div>
  </section>

  <section class="features" id="features">
    <div class="wrap">
      <h2 class="section-title">只做专注这一件事</h2>
      <div class="feature-grid">

        <article class="feature">
          <span class="feature-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="4" width="16" height="16" rx="3"></rect>
              <path d="M8 12l3 3 5-6"></path>
            </svg>
          </span>
          <h3>白名单完整闭环</h3>
          <p>专注内直达工具应用，用完一键返回，不打断专注流。</p>
        </article>

        <article class="feature">
          <span class="feature-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l7 3v6c0 4.2-2.9 7.4-7 9-4.1-1.6-7-4.8-7-9V6l7-3z"></path>
              <path d="M9.5 12.2l1.8 1.8 3.4-3.6"></path>
            </svg>
          </span>
          <h3>纯本地无账号</h3>
          <p>零网络权限，所有数据仅存本机，不收集、不上传，无隐私顾虑。</p>
        </article>

        <article class="feature">
          <span class="feature-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="8.5"></circle>
              <path d="M12 7.5V12l3 2"></path>
            </svg>
          </span>
          <h3>极简无广告</h3>
          <p>无冗余功能、无广告、无会员，打开即用，到点即走。</p>
        </article>

        <!-- 扩展位：产品对比模块（/compare/）建成后在此插入引导入口 -->
      </div>
    </div>
  </section>

  <section class="download" id="download">
    <div class="wrap download-inner">
      <h2 class="section-title">下载</h2>
      <p class="download-text">
        安卓版正在准备上架，暂不提供安装包。<br>
        上线后会在这里放官方下载入口。
      </p>
      <span class="btn btn-primary is-disabled" aria-disabled="true">即将上线</span>
      <!-- 扩展位：下载中心（/download/）建成后替换为多入口卡片 -->
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="copyright">© 2026 番茄结界</p>
    <nav class="footer-nav" aria-label="页脚导航">
      <a href="privacy/">隐私政策</a>
      <!--
        预留入口（对应页面建好后取消注释）：
        <a href="download/">下载中心</a>
        <a href="features/">功能详解</a>
        <a href="changelog/">更新日志</a>
        <a href="faq/">常见问题</a>
        <a href="feedback/">用户反馈</a>
        <a href="compare/">产品对比</a>
        <a href="docs/">开发者</a>
      -->
    </nav>
  </div>
</footer>

</body>
</html>
